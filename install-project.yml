name: Install Hobi TV Project

on:
  push:
    paths:
      - project.b64
      - .github/workflows/install-project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild repository from project bundle
        shell: bash
        run: |
          set -e
          base64 -d project.b64 > /tmp/hobitv-project.tar.gz
          mkdir -p /tmp/hobitv-project
          tar -xzf /tmp/hobitv-project.tar.gz -C /tmp/hobitv-project

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name project.b64 ! -name .github -exec rm -rf {} +
          rm -f .github/workflows/install-project.yml
          cp -a /tmp/hobitv-project/. .

          rm -f project.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Hobi TV Android project" || true
          git push
